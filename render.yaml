# Render Blueprint for the two API services. The frontend deploys on Vercel (docs/deployment.md).
services:
  - type: web
    name: voyagent-ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: INTERNAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: SEARCHAPI_KEY
        sync: false

  - type: web
    name: voyagent-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_DB_URI
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
