# Same checks as .github/workflows/ci.yml, for the GitLab mirror.
stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

ai-service:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files: [ai-service/uv.lock]
    paths: [.uv-cache]
  script:
    - cd ai-service
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest

backend:
  stage: test
  # Debian, not Alpine: mongodb-memory-server downloads a glibc MongoDB build.
  image: node:22-bookworm
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [backend/package-lock.json]
    paths: [.npm, .cache/mongodb-binaries]
  script:
    - export MONGOMS_DOWNLOAD_DIR="$CI_PROJECT_DIR/.cache/mongodb-binaries"
    - cd backend
    - npm ci
    - npm test

frontend:
  stage: test
  image: node:22-bookworm
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
    NEXT_PUBLIC_API_URL: https://example.invalid/api
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.npm]
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm test
    - npm run build

docs:
  stage: test
  image: python:3.12-slim
  script:
    # Docs that do not match the code are graded as absent, so every file:line is checked.
    - python scripts/check_doc_refs.py
