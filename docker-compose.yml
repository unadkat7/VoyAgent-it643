services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

  ai-service:
    build: ./ai-service
    env_file: .env
    environment:
      ENVIRONMENT: development
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGO_DB_URI: mongodb://mongo:27017/voyagent
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - ai-service

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
